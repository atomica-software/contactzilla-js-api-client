name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run generate:check
      - run: npm run typecheck
        if: matrix.node != 18
      - run: npm test
        if: matrix.node != 18
      - run: npm run build
      - name: Smoke-test the packed package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null && npm pkg set type=module
          npm install "$RUNNER_TEMP"/atomica-software-contactzilla-*.tgz
          node -e 'import("@atomica-software/contactzilla").then(m => { if (!m.ContactzillaClient || !m.operations.listContacts) process.exit(1); console.log("core ok") })'
          node -e 'import("@atomica-software/contactzilla/extend").then(m => { if (!m.createExtendClient) process.exit(1); console.log("extend ok") })'
