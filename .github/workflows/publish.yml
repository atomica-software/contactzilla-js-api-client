name: Publish to npm

# Runs when a GitHub release is published (tag vX.Y.Z matching package.json).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.9.0 # trusted publishing needs npm >= 11.5
      - run: npm ci --ignore-scripts
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} doesn't match package.json ${version}"; exit 1; }
      - run: npm run generate:check && npm run typecheck && npm test && npm run build
      # Trusted publishing only: npm exchanges this job's OIDC identity (id-token: write)
      # for a short-lived credential. No npm token is stored anywhere, so there's none
      # to leak. Configure it on npmjs.com: package Settings > Trusted Publisher >
      # GitHub Actions, atomica-software / contactzilla-js-api-client, publish.yml, env "npm".
      - run: npm publish --provenance --access public
